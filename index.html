<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パン在庫管理アプリ</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B82F6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="パン在庫管理">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500&display=swap">
    <style>
        .font-display { font-family: 'Cormorant Garamond', 'Noto Serif JP', serif; }
        .font-serif-jp { font-family: 'Noto Serif JP', serif; }
        .display-root { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .display-fade { animation: displayFade .8s ease; }
        @keyframes displayFade { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Lucide Reactのアイコンをシンプルに再現
        const Camera = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                <circle cx="12" cy="13" r="3"/>
            </svg>
        );
        
        const Clock = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12,6 12,12 16,14"/>
            </svg>
        );
        
        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3,6 5,6 21,6"/>
                <path d="m19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
        );
        
        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        );
        
        const Minus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        );
        
        const AlertCircle = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        );

        // 画像圧縮関数
        const compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = () => {
                    // アスペクト比を維持してリサイズ
                    const ratio = Math.min(maxWidth / img.width, maxWidth / img.height);
                    canvas.width = img.width * ratio;
                    canvas.height = img.height * ratio;
                    
                    // 画像を描画
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // 圧縮された画像データを取得
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                    resolve(compressedDataUrl);
                };
                
                img.src = URL.createObjectURL(file);
            });
        };

        const Pencil = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            </svg>
        );

        const Package = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m7.5 4.27 9 5.15"/>
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                <path d="m3.3 7 8.7 5 8.7-5"/>
                <path d="M12 22V12"/>
            </svg>
        );

        const Snowflake = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>
                <path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/>
            </svg>
        );

        const Monitor = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
        );

        // ===== アレルゲン =====
        // 特定原材料（表示義務 9品目：2025年度にカシューナッツが追加）
        const ALLERGENS_REQUIRED = ['小麦', '卵', '乳', 'えび', 'かに', 'くるみ', 'そば', '落花生', 'カシューナッツ'];
        // 特定原材料に準ずるもの（表示推奨 20品目）
        const ALLERGENS_RECOMMENDED = [
            'アーモンド', 'あわび', 'いか', 'いくら', 'オレンジ', 'キウイフルーツ', '牛肉', 'ごま', 'さけ', 'さば',
            '大豆', '鶏肉', 'バナナ', '豚肉', 'マカダミアナッツ', 'もも', 'やまいも', 'りんご', 'ゼラチン', 'ピスタチオ'
        ];

        const DAY_OPTIONS = [1, 2, 3, 4, 5, 6, 7, 10, 14];

        // ===== 保存まわり =====
        const STORAGE_INVENTORY = 'breadInventory';
        const STORAGE_MASTER = 'breadMaster';
        const STORAGE_SETTINGS = 'breadDisplaySettings';
        const STORAGE_RECEIVE_FROZEN = 'breadReceiveFrozen';
        const STORAGE_DISPLAY_MODE = 'breadDisplayMode';

        // 解凍後の日持ち（0 = 解凍した日の営業終了まで＝当日中）
        const THAW_OPTIONS = [
            { value: 0, label: '当日中' },
            { value: 24, label: '24時間' },
            { value: 48, label: '48時間' }
        ];
        const thawLabel = (h) => (THAW_OPTIONS.find(o => o.value === h) || { label: `${h}時間` }).label;

        const DEFAULT_SETTINGS = {
            title: 'FIVERAN BAKERY',
            subtitle: 'SELECTION',
            message: 'コーヒーと、いいパンを。',
            price: '',
            note: 'ご注文後に温めてお出しします',
            source: 'all',          // all = 冷凍＋解凍済み / thawed = 解凍済みのみ
            showAllergens: true,
            footer: 'SHIMOGAMO'
        };

        const loadJSON = (key, fallback) => {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : fallback;
            } catch (e) {
                console.error('読み込みエラー:', key, e);
                return fallback;
            }
        };

        const saveJSON = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (e) {
                console.error('保存エラー:', key, e);
                return false;
            }
        };

        const newId = () => Date.now() + Math.floor(Math.random() * 1000);

        const reviveLot = (b) => ({
            ...b,
            deliveryTime: new Date(b.deliveryTime),
            thawedAt: b.thawedAt ? new Date(b.thawedAt) : null
        });

        const sameDay = (a, b) => {
            const x = new Date(a), y = new Date(b);
            return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
        };

        const toLocalInputValue = (date) => {
            const d = new Date(date);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const formatDateTime = (date) => {
            try {
                return new Date(date).toLocaleString('ja-JP', {
                    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                });
            } catch (e) {
                return '日時エラー';
            }
        };

        // ===== 小さな部品 =====
        const AllergenChips = ({ allergens }) => {
            if (!allergens || allergens.length === 0) {
                return <div className="text-xs text-gray-400">アレルゲン登録なし</div>;
            }
            return (
                <div className="flex flex-wrap gap-1">
                    {allergens.map(a => (
                        <span key={a} className={`text-xs px-2 py-0.5 rounded-full border ${
                            ALLERGENS_REQUIRED.includes(a)
                                ? 'bg-amber-50 border-amber-300 text-amber-800'
                                : 'bg-gray-50 border-gray-300 text-gray-700'
                        }`}>{a}</span>
                    ))}
                </div>
            );
        };

        const Modal = ({ title, onClose, children, footer }) => (
            <div className="fixed inset-0 z-50 bg-black bg-opacity-40 flex items-end sm:items-center justify-center" onClick={onClose}>
                <div className="bg-white w-full sm:max-w-lg max-h-[90vh] rounded-t-2xl sm:rounded-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                    <div className="flex items-center justify-between px-5 py-4 border-b">
                        <h2 className="text-lg font-bold text-gray-800">{title}</h2>
                        <button onClick={onClose} className="text-gray-500 text-2xl leading-none px-2" aria-label="閉じる">×</button>
                    </div>
                    <div className="overflow-y-auto px-5 py-4 flex-1">{children}</div>
                    {footer && <div className="px-5 py-4 border-t">{footer}</div>}
                </div>
            </div>
        );

        // ===== マスタ編集フォーム =====
        const MasterForm = ({ initial, onSave, onCancel, setError }) => {
            const [name, setName] = useState(initial?.name || '');
            const [days, setDays] = useState(initial?.expirationDays ?? 5);
            const [thawHours, setThawHours] = useState(initial?.thawHours ?? 0);
            const [photo, setPhoto] = useState(initial?.photo || null);
            const [allergens, setAllergens] = useState(initial?.allergens || []);
            const [busy, setBusy] = useState(false);
            const photoRef = useRef(null);
            const showRecommendedInit = (initial?.allergens || []).some(a => ALLERGENS_RECOMMENDED.includes(a));

            const toggle = (a) => setAllergens(prev =>
                prev.includes(a) ? prev.filter(x => x !== a) : [...prev, a]
            );

            const onPhoto = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                setBusy(true);
                try {
                    setPhoto(await compressImage(file, 600, 0.7));
                } catch (err) {
                    setError('写真の処理中にエラーが発生しました');
                }
                setBusy(false);
            };

            const submit = () => {
                if (!name.trim()) {
                    setError('パン名を入力してください');
                    return;
                }
                const order = [...ALLERGENS_REQUIRED, ...ALLERGENS_RECOMMENDED];
                onSave({
                    id: initial?.id ?? newId(),
                    name: name.trim(),
                    expirationDays: Number(days),
                    thawHours: Number(thawHours),
                    photo,
                    allergens: [...allergens].sort((a, b) => order.indexOf(a) - order.indexOf(b))
                });
            };

            const chip = (a, required) => (
                <label key={a} className={`text-sm px-3 py-1.5 rounded-full border cursor-pointer select-none ${
                    allergens.includes(a)
                        ? (required ? 'bg-amber-500 border-amber-500 text-white' : 'bg-gray-700 border-gray-700 text-white')
                        : 'bg-white border-gray-300 text-gray-700'
                }`}>
                    <input type="checkbox" className="hidden" checked={allergens.includes(a)} onChange={() => toggle(a)} />
                    {a}
                </label>
            );

            return (
                <Modal
                    title={initial ? 'マスタを編集' : 'マスタに登録'}
                    onClose={onCancel}
                    footer={
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-lg border border-gray-300 text-gray-700">キャンセル</button>
                            <button onClick={submit} disabled={busy} className="flex-1 py-3 rounded-lg bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white font-medium">保存</button>
                        </div>
                    }
                >
                    <div className="space-y-5">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">パン名（必須）</label>
                            <input
                                type="text" value={name} onChange={e => setName(e.target.value)}
                                placeholder="例：クロワッサン"
                                className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:border-blue-500 outline-none"
                            />
                        </div>

                        <div className="flex flex-wrap gap-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">日持ち（納品から）</label>
                                <select
                                    value={days} onChange={e => setDays(Number(e.target.value))}
                                    className="border border-gray-300 rounded-lg px-3 py-2 bg-white focus:border-blue-500 outline-none"
                                >
                                    {DAY_OPTIONS.map(d => <option key={d} value={d}>{d}日</option>)}
                                </select>
                                <p className="text-xs text-gray-500 mt-1">冷凍品は冷凍庫での保管期限</p>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">解凍後の日持ち</label>
                                <select
                                    value={thawHours} onChange={e => setThawHours(Number(e.target.value))}
                                    className="border border-gray-300 rounded-lg px-3 py-2 bg-white focus:border-blue-500 outline-none"
                                >
                                    {THAW_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                </select>
                                <p className="text-xs text-gray-500 mt-1">解凍した時点から数えます</p>
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">写真</label>
                            <div className="flex items-center gap-3">
                                <div className="w-24 h-24 rounded-lg bg-gray-100 overflow-hidden flex items-center justify-center text-gray-400 text-xs">
                                    {photo ? <img src={photo} className="w-full h-full object-cover" /> : '写真なし'}
                                </div>
                                <div className="flex flex-col gap-2">
                                    <button onClick={() => photoRef.current?.click()} disabled={busy}
                                        className="flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm">
                                        <Camera size={16} /> {busy ? '圧縮中...' : (photo ? '撮り直す' : '撮影・選択')}
                                    </button>
                                    {photo && (
                                        <button onClick={() => setPhoto(null)} className="text-sm text-red-600 text-left px-1">写真を外す</button>
                                    )}
                                </div>
                            </div>
                            <input type="file" ref={photoRef} onChange={onPhoto} accept="image/*" capture="environment" style={{ display: 'none' }} />
                        </div>

                        <div>
                            <div className="text-sm font-medium text-gray-700 mb-2">アレルゲン（特定原材料）</div>
                            <div className="flex flex-wrap gap-2">
                                {ALLERGENS_REQUIRED.map(a => chip(a, true))}
                            </div>
                            <details className="mt-3" open={showRecommendedInit}>
                                <summary className="text-sm text-gray-600 cursor-pointer">特定原材料に準ずるもの（推奨20品目）</summary>
                                <div className="flex flex-wrap gap-2 mt-2">
                                    {ALLERGENS_RECOMMENDED.map(a => chip(a, false))}
                                </div>
                            </details>
                        </div>
                    </div>
                </Modal>
            );
        };

        // ===== 入荷登録（マスタから選択） =====
        const ReceiveModal = ({ masters, onReceive, onClose, onGoMaster }) => {
            const [qty, setQty] = useState({}); // masterId -> 数量
            const [query, setQuery] = useState('');
            const [deliveryTime, setDeliveryTime] = useState(toLocalInputValue(new Date()));
            const [frozen, setFrozen] = useState(() => loadJSON(STORAGE_RECEIVE_FROZEN, true));
            const toggleFrozen = () => setFrozen(f => { saveJSON(STORAGE_RECEIVE_FROZEN, !f); return !f; });

            const change = (id, delta) => setQty(prev => {
                const v = Math.max(0, (prev[id] || 0) + delta);
                return { ...prev, [id]: v };
            });

            const filtered = masters.filter(m => m.name.includes(query.trim()));
            const selected = masters.filter(m => (qty[m.id] || 0) > 0);
            const total = selected.reduce((s, m) => s + qty[m.id], 0);

            const submit = () => {
                if (selected.length === 0) return;
                onReceive(selected.map(m => ({ master: m, stock: qty[m.id] })), new Date(deliveryTime), frozen);
            };

            return (
                <Modal
                    title="入荷を登録"
                    onClose={onClose}
                    footer={
                        <button onClick={submit} disabled={selected.length === 0}
                            className="w-full py-3 rounded-lg bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 text-white font-medium">
                            {selected.length === 0 ? '入荷するパンを選んでください' : `${selected.length}品目・${total}個を${frozen ? '冷凍で' : ''}入荷`}
                        </button>
                    }
                >
                    {masters.length === 0 ? (
                        <div className="text-center py-8 text-gray-600">
                            <p>マスタにパンが登録されていません。</p>
                            <button onClick={onGoMaster} className="mt-4 px-4 py-2 rounded-lg bg-blue-500 text-white">マスタを登録する</button>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            <button onClick={toggleFrozen}
                                className={`w-full flex items-center justify-between px-4 py-3 rounded-lg border ${frozen ? 'border-sky-400 bg-sky-50 text-sky-800' : 'border-gray-300 text-gray-700'}`}>
                                <span className="flex items-center gap-2 font-medium"><Snowflake size={18} /> 冷凍便で入荷</span>
                                <span className={`w-12 h-7 rounded-full relative transition-colors ${frozen ? 'bg-sky-500' : 'bg-gray-300'}`}>
                                    <span className={`absolute top-1 w-5 h-5 rounded-full bg-white transition-all ${frozen ? 'left-6' : 'left-1'}`}></span>
                                </span>
                            </button>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <input type="search" value={query} onChange={e => setQuery(e.target.value)} placeholder="パン名で検索"
                                    className="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:border-blue-500 outline-none" />
                                <input type="datetime-local" value={deliveryTime} onChange={e => setDeliveryTime(e.target.value)}
                                    className="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" title="納品日時" />
                            </div>
                            {filtered.map(m => {
                                const n = qty[m.id] || 0;
                                return (
                                    <div key={m.id} className={`flex items-center gap-3 p-2 rounded-lg border ${n > 0 ? 'border-blue-400 bg-blue-50' : 'border-gray-200'}`}>
                                        <div className="w-14 h-14 rounded bg-gray-100 overflow-hidden flex-shrink-0">
                                            {m.photo && <img src={m.photo} className="w-full h-full object-cover" />}
                                        </div>
                                        <div className="flex-1 min-w-0" onClick={() => n === 0 && change(m.id, 1)}>
                                            <div className="font-medium text-gray-800 truncate">{m.name}</div>
                                            <div className="text-xs text-gray-500">日持ち {m.expirationDays}日</div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => change(m.id, -1)} disabled={n === 0}
                                                className="w-9 h-9 rounded-full bg-gray-100 disabled:text-gray-300 flex items-center justify-center"><Minus size={14} /></button>
                                            <span className="w-6 text-center font-bold">{n}</span>
                                            <button onClick={() => change(m.id, 1)}
                                                className="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center"><Plus size={14} /></button>
                                        </div>
                                    </div>
                                );
                            })}
                            {filtered.length === 0 && <p className="text-sm text-gray-500 text-center py-4">該当するパンがありません</p>}
                        </div>
                    )}
                </Modal>
            );
        };

        // ===== 店頭表示の設定 =====
        const DisplaySettings = ({ settings, onChange, onReset, itemCount, onStart }) => {
            const field = (key, label, placeholder, hint) => (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                    <input type="text" value={settings[key]} placeholder={placeholder}
                        onChange={e => onChange({ [key]: e.target.value })}
                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:border-blue-500 outline-none" />
                    {hint && <p className="text-xs text-gray-500 mt-1">{hint}</p>}
                </div>
            );
            return (
                <div className="bg-white rounded-lg shadow-sm p-6 space-y-5">
                    <div className="grid sm:grid-cols-2 gap-4">
                        {field('title', 'タイトル', 'FIVERAN BAKERY')}
                        {field('subtitle', 'サブタイトル', 'SELECTION')}
                        {field('message', 'ひとこと', 'コーヒーと、いいパンを。')}
                        {field('price', '統一価格', '例：350', '数字だけでOK（¥は自動で付きます）。空欄なら価格は表示しません')}
                        {field('note', '価格の下の一文', 'ご注文後に温めてお出しします')}
                        {field('footer', '画面下の店名', 'SHIMOGAMO')}
                    </div>

                    <div>
                        <div className="text-sm font-medium text-gray-700 mb-2">表示するパン</div>
                        <div className="flex flex-col sm:flex-row gap-2">
                            {[
                                ['all', '冷凍庫の在庫も含めて全部', '注文が入ってから温める運用向け'],
                                ['thawed', '解凍済みのパンだけ', '朝に解凍して並べる運用向け']
                            ].map(([k, label, hint]) => (
                                <button key={k} onClick={() => onChange({ source: k })}
                                    className={`flex-1 text-left px-4 py-3 rounded-lg border ${settings.source === k ? 'border-blue-500 bg-blue-50' : 'border-gray-300'}`}>
                                    <div className="font-medium text-gray-800 text-sm">{label}</div>
                                    <div className="text-xs text-gray-500">{hint}</div>
                                </button>
                            ))}
                        </div>
                    </div>

                    <label className="flex items-center gap-3 text-sm text-gray-700">
                        <input type="checkbox" checked={settings.showAllergens} onChange={e => onChange({ showAllergens: e.target.checked })} className="w-5 h-5" />
                        アレルゲンを表示する
                    </label>

                    <div className="flex flex-col sm:flex-row gap-3 pt-2 border-t">
                        <button onClick={onStart}
                            className="flex-1 flex items-center justify-center gap-2 bg-gray-900 hover:bg-black text-white py-3 rounded-lg font-medium mt-3">
                            <Monitor size={18} /> 店頭表示を開始（今 {itemCount} 品）
                        </button>
                        <button onClick={onReset} className="sm:w-40 py-3 rounded-lg border border-gray-300 text-gray-600 text-sm mt-3">初期設定に戻す</button>
                    </div>
                    <p className="text-xs text-gray-500 leading-relaxed">
                        店頭表示中は、画面右下の「管理」を2秒長押しするとこの画面に戻ります。在庫が0個になったパンや廃棄期限を過ぎたパンは自動で表示から消えます。
                    </p>
                </div>
            );
        };

        // ===== お客さん向け店頭表示 =====
        const DisplayView = ({ items, settings, onExit }) => {
            const [page, setPage] = useState(0);
            const [landscape, setLandscape] = useState(() => window.innerWidth >= window.innerHeight);
            const [holding, setHolding] = useState(false);
            const holdTimer = useRef(null);

            useEffect(() => {
                const onResize = () => setLandscape(window.innerWidth >= window.innerHeight);
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            // 画面が消えないようにする（対応しているブラウザのみ）
            useEffect(() => {
                let lock = null;
                const request = async () => {
                    try {
                        if ('wakeLock' in navigator && document.visibilityState === 'visible') {
                            lock = await navigator.wakeLock.request('screen');
                        }
                    } catch (e) { /* 非対応なら何もしない */ }
                };
                request();
                document.addEventListener('visibilitychange', request);
                return () => {
                    document.removeEventListener('visibilitychange', request);
                    try { lock && lock.release(); } catch (e) {}
                };
            }, []);

            // 品数に合わせてレイアウトを決める
            const n = items.length;
            const layout = landscape
                ? (n <= 1 ? [1, 1] : n <= 3 ? [n, 1] : n <= 4 ? [4, 1] : n <= 6 ? [3, 2] : [4, 2])
                : (n <= 1 ? [1, 1] : n <= 2 ? [1, 2] : n <= 4 ? [2, 2] : [2, 3]);
            const perPage = layout[0] * layout[1];
            const minCols = landscape ? 3 : 2;
            const pages = Math.max(1, Math.ceil(n / perPage));
            const current = page % pages;
            const pageItems = items.slice(current * perPage, current * perPage + perPage);

            useEffect(() => {
                if (pages <= 1) return;
                const t = setInterval(() => setPage(p => (p + 1) % pages), 8000);
                return () => clearInterval(t);
            }, [pages]);

            const startHold = () => {
                setHolding(true);
                holdTimer.current = setTimeout(() => { setHolding(false); onExit(); }, 2000);
            };
            const cancelHold = () => {
                setHolding(false);
                clearTimeout(holdTimer.current);
            };

            const price = String(settings.price || '').trim();
            const priceText = price ? (/^[\d,]+$/.test(price) ? `¥${price}` : price) : '';
            const ink = '#EFE9DF', muted = 'rgba(239,233,223,0.55)', line = 'rgba(239,233,223,0.18)';

            return (
                <div className="display-root fixed inset-0 flex flex-col overflow-hidden" style={{ background: '#13110F', color: ink, padding: '3.5vh 4vw 2.5vh' }}>
                    {/* ヘッダー */}
                    <div className="flex items-end justify-between gap-6 pb-[2.5vh]" style={{ borderBottom: `1px solid ${line}` }}>
                        <div className="min-w-0">
                            <div className="font-display leading-none" style={{ fontSize: 'clamp(28px, 4.6vw, 64px)', letterSpacing: '0.18em', fontWeight: 500 }}>
                                {settings.title}
                            </div>
                            {settings.subtitle && (
                                <div className="font-display mt-2" style={{ fontSize: 'clamp(12px, 1.5vw, 20px)', letterSpacing: '0.42em', color: muted }}>
                                    {settings.subtitle}
                                </div>
                            )}
                            {settings.message && (
                                <div className="font-serif-jp mt-3" style={{ fontSize: 'clamp(12px, 1.4vw, 18px)', color: muted, letterSpacing: '0.12em' }}>
                                    {settings.message}
                                </div>
                            )}
                        </div>
                        {(priceText || settings.note) && (
                            <div className="text-right flex-shrink-0">
                                {priceText && (
                                    <div className="flex items-baseline justify-end gap-3">
                                        <span className="font-serif-jp" style={{ fontSize: 'clamp(12px, 1.4vw, 18px)', color: muted, letterSpacing: '0.2em' }}>全品</span>
                                        <span className="font-display leading-none" style={{ fontSize: 'clamp(32px, 5vw, 72px)', fontWeight: 500 }}>{priceText}</span>
                                    </div>
                                )}
                                {settings.note && (
                                    <div className="font-serif-jp mt-2" style={{ fontSize: 'clamp(11px, 1.25vw, 16px)', color: muted, letterSpacing: '0.1em' }}>
                                        {settings.note}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* パン一覧 */}
                    <div className="flex-1 min-h-0 py-[3vh]">
                        {n === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-center">
                                <div className="font-serif-jp" style={{ fontSize: 'clamp(18px, 2.4vw, 32px)', letterSpacing: '0.15em' }}>本日のパンは売り切れました</div>
                                <div className="font-display mt-4" style={{ fontSize: 'clamp(12px, 1.4vw, 18px)', color: muted, letterSpacing: '0.3em' }}>SOLD OUT · THANK YOU</div>
                            </div>
                        ) : (
                            <div key={`${current}-${perPage}`} className="display-fade h-full grid"
                                style={n < minCols ? {
                                    // 品数が少ないときは大きくなりすぎないよう中央寄せ
                                    gridTemplateColumns: `repeat(${n}, calc((100% - ${minCols - 1} * 2.2vw) / ${minCols}))`,
                                    gridTemplateRows: landscape ? 'minmax(0, 1fr)' : 'minmax(0, 0.6fr)',
                                    justifyContent: 'center', alignContent: 'center', gap: '2.5vh 2.2vw'
                                } : {
                                    gridTemplateColumns: `repeat(${layout[0]}, minmax(0, 1fr))`, gridTemplateRows: `repeat(${layout[1]}, minmax(0, 1fr))`, gap: '2.5vh 2.2vw'
                                }}>
                                {pageItems.map(item => (
                                    <div key={item.key} className="flex flex-col min-h-0">
                                        <div className="flex-1 min-h-0 overflow-hidden relative" style={{ background: '#1E1B18', borderRadius: 4 }}>
                                            {item.photo ? (
                                                <img src={item.photo} alt={item.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center font-serif-jp px-4 text-center" style={{ color: muted, fontSize: 'clamp(14px, 1.8vw, 24px)' }}>{item.name}</div>
                                            )}
                                            {item.stock === 1 && (
                                                <span className="absolute top-3 right-3 font-serif-jp px-3 py-1" style={{ background: 'rgba(19,17,15,0.78)', fontSize: 'clamp(10px, 1.1vw, 14px)', letterSpacing: '0.1em', borderRadius: 2 }}>残りわずか</span>
                                            )}
                                        </div>
                                        <div className="pt-[1.4vh]">
                                            <div className="font-serif-jp truncate" style={{ fontSize: 'clamp(14px, 1.7vw, 24px)', letterSpacing: '0.06em' }}>{item.name}</div>
                                            {settings.showAllergens && item.allergens && item.allergens.length > 0 && (
                                                <div className="font-serif-jp truncate mt-1" style={{ fontSize: 'clamp(10px, 1vw, 13px)', color: muted }}>
                                                    アレルゲン：{item.allergens.join('・')}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* フッター */}
                    <div className="flex items-center justify-between pt-[1.8vh]" style={{ borderTop: `1px solid ${line}` }}>
                        <div className="font-display" style={{ fontSize: 'clamp(11px, 1.2vw, 15px)', letterSpacing: '0.4em', color: muted }}>{settings.footer}</div>
                        <div className="flex gap-2">
                            {pages > 1 && Array.from({ length: pages }).map((_, i) => (
                                <span key={i} style={{ width: 6, height: 6, borderRadius: 3, background: i === current ? ink : line }} />
                            ))}
                        </div>
                        <button
                            onPointerDown={startHold} onPointerUp={cancelHold} onPointerLeave={cancelHold} onPointerCancel={cancelHold}
                            onContextMenu={e => e.preventDefault()}
                            className="font-serif-jp px-3 py-2 -my-2 -mr-3 transition-colors"
                            style={{ fontSize: 12, color: holding ? ink : 'rgba(239,233,223,0.22)', letterSpacing: '0.1em' }}>
                            {holding ? '戻ります…' : '管理'}
                        </button>
                    </div>
                </div>
            );
        };

        // ===== メインアプリ =====
        const BreadInventoryApp = () => {
            const [tab, setTab] = useState('inventory');
            const [breads, setBreads] = useState(() =>
                loadJSON(STORAGE_INVENTORY, []).map(reviveLot)
            );
            const [masters, setMasters] = useState(() => loadJSON(STORAGE_MASTER, []));
            const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...loadJSON(STORAGE_SETTINGS, {}) }));
            const [displayMode, setDisplayMode] = useState(() => loadJSON(STORAGE_DISPLAY_MODE, false));
            const [filter, setFilter] = useState('all'); // all | thawed | frozen
            const [currentTime, setCurrentTime] = useState(new Date());
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [showReceive, setShowReceive] = useState(false);
            const [editingMaster, setEditingMaster] = useState(null); // null | 'new' | master | {fromBread}
            const fileInputRef = useRef(null);
            const importRef = useRef(null);

            useEffect(() => {
                if (!saveJSON(STORAGE_INVENTORY, breads)) {
                    setError('在庫データを保存できませんでした（端末の保存容量不足の可能性があります）');
                }
            }, [breads]);

            useEffect(() => {
                if (!saveJSON(STORAGE_MASTER, masters)) {
                    setError('マスタを保存できませんでした（端末の保存容量不足の可能性があります）。写真の多いパンを整理してください');
                }
            }, [masters]);

            useEffect(() => { saveJSON(STORAGE_SETTINGS, settings); }, [settings]);
            useEffect(() => { saveJSON(STORAGE_DISPLAY_MODE, displayMode); }, [displayMode]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const masterById = (id) => masters.find(m => m.id === id);

            // 在庫カードに表示する情報（マスタ紐付きならマスタの最新情報を使う）
            const viewOf = (bread) => {
                const m = bread.masterId != null ? masterById(bread.masterId) : null;
                return {
                    name: m ? m.name : bread.name,
                    photo: m ? m.photo : bread.photo,
                    allergens: m ? m.allergens : (bread.allergens || []),
                    thawHours: m ? m.thawHours : undefined,
                    isTemp: bread.masterId == null,
                    masterMissing: bread.masterId != null && !m
                };
            };

            // ----- 入荷 -----
            const receive = (items, deliveryTime, frozen) => {
                const lots = items.map(({ master, stock }, i) => ({
                    id: newId() + i,
                    masterId: master.id,
                    name: master.name,               // マスタ削除時の控え
                    allergens: master.allergens,     // マスタ削除時の控え
                    deliveryTime,
                    expirationHours: master.expirationDays * 24,
                    frozen: !!frozen,
                    thawedAt: null,
                    thawHours: master.thawHours ?? 0,
                    stock
                }));
                setBreads(prev => [...prev, ...lots]);
                setShowReceive(false);
                if (frozen) setFilter('all');
            };

            // ----- 解凍（冷凍ロットから1個ずつ、解凍済みロットへ移す） -----
            const thawOne = (lotId) => {
                setBreads(prev => {
                    const src = prev.find(b => b.id === lotId);
                    if (!src || !src.frozen || src.stock <= 0) return prev;
                    const now = new Date();
                    const m = src.masterId != null ? masters.find(x => x.id === src.masterId) : null;
                    const thawHours = m?.thawHours ?? src.thawHours ?? 0;
                    // 同じ冷凍ロットから今日解凍した分があればまとめる
                    const target = prev.find(b => !b.frozen && b.thawedFrom === src.id && b.thawedAt && sameDay(b.thawedAt, now));
                    let next = prev.map(b => b.id === src.id ? { ...b, stock: b.stock - 1 } : b);
                    if (target) {
                        next = next.map(b => b.id === target.id ? { ...b, stock: b.stock + 1 } : b);
                    } else {
                        next = [...next, {
                            ...src,
                            id: newId(),
                            frozen: false,
                            thawedFrom: src.id,
                            thawedAt: now,
                            thawHours,
                            stock: 1
                        }];
                    }
                    // 冷凍分を使い切ったら冷凍ロットは片付ける
                    return next.filter(b => !(b.id === src.id && b.stock <= 0));
                });
            };

            const handlePhotoCapture = async (event) => {
                setError('');
                const file = event.target.files[0];
                if (event.target) event.target.value = '';
                if (!file) return;
                setIsLoading(true);
                try {
                    const compressedImage = await compressImage(file);
                    setBreads(prev => [...prev, {
                        id: newId(),
                        masterId: null,
                        name: '',
                        photo: compressedImage,
                        allergens: [],
                        deliveryTime: new Date(),
                        expirationHours: 120,
                        stock: 1
                    }]);
                } catch (e) {
                    console.error('写真処理エラー:', e);
                    setError('写真の処理中にエラーが発生しました');
                }
                setIsLoading(false);
            };

            const updateBread = (id, patch) =>
                setBreads(prev => prev.map(b => b.id === id ? { ...b, ...patch } : b));

            const updateStock = (id, change) =>
                setBreads(prev => prev.map(b => b.id === id ? { ...b, stock: Math.max(0, b.stock + change) } : b));

            const deleteBread = (id) => {
                if (confirm('このパンを削除しますか？')) {
                    setBreads(prev => prev.filter(b => b.id !== id));
                }
            };

            const deleteExpired = () => {
                const expired = breads.filter(b => getTimeUntilExpiration(b).expired);
                if (expired.length === 0) return;
                if (confirm(`廃棄対象の ${expired.length} 件をまとめて削除しますか？`)) {
                    const ids = new Set(expired.map(b => b.id));
                    setBreads(prev => prev.filter(b => !ids.has(b.id)));
                }
            };

            // ----- マスタ -----
            const saveMaster = (master, fromBreadId) => {
                setMasters(prev => prev.some(m => m.id === master.id)
                    ? prev.map(m => m.id === master.id ? master : m)
                    : [...prev, master]);
                if (fromBreadId != null) {
                    // 臨時入荷のパンをマスタに紐付け（写真はマスタ側へ移す）
                    setBreads(prev => prev.map(b => b.id === fromBreadId
                        ? { ...b, masterId: master.id, name: master.name, allergens: master.allergens, photo: undefined }
                        : b));
                }
                setEditingMaster(null);
            };

            const deleteMaster = (master) => {
                const inUse = breads.filter(b => b.masterId === master.id).length;
                const msg = inUse > 0
                    ? `「${master.name}」をマスタから削除しますか？\n在庫中の ${inUse} 件は名前・アレルゲンを残したまま表示されます（写真は消えます）。`
                    : `「${master.name}」をマスタから削除しますか？`;
                if (confirm(msg)) {
                    setMasters(prev => prev.filter(m => m.id !== master.id));
                }
            };

            const exportData = () => {
                const data = { version: 2, exportedAt: new Date().toISOString(), masters, inventory: breads };
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `bread-inventory-${toLocalInputValue(new Date()).slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
            };

            const importData = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    if (!Array.isArray(data.masters)) throw new Error('形式が違います');
                    const withInv = Array.isArray(data.inventory);
                    if (!confirm(`マスタ ${data.masters.length} 件${withInv ? `・在庫 ${data.inventory.length} 件` : ''}で、今のデータを置き換えますか？`)) return;
                    setMasters(data.masters);
                    if (withInv) setBreads(data.inventory.map(b => ({ ...b, deliveryTime: new Date(b.deliveryTime) })));
                } catch (err) {
                    setError('バックアップファイルを読み込めませんでした');
                }
            };

            // ----- 期限計算 -----
            const getExpirationTime = (bread) => {
                if (bread.thawedAt) {
                    const t = new Date(bread.thawedAt);
                    if (!bread.thawHours) {
                        // 当日中 = 解凍した日の23:59まで
                        return new Date(t.getFullYear(), t.getMonth(), t.getDate(), 23, 59, 59);
                    }
                    return new Date(t.getTime() + bread.thawHours * 3600 * 1000);
                }
                return new Date(new Date(bread.deliveryTime).getTime() + (bread.expirationHours ?? 120) * 3600 * 1000);
            };

            const getTimeUntilExpiration = (bread) => {
                const diff = getExpirationTime(bread) - currentTime;
                if (diff <= 0) return { expired: true, urgent: false, text: '廃棄時間経過' };
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                if (hours < 24) return { expired: false, urgent: hours < 6, text: `残り${hours}時間${minutes}分` };
                return { expired: false, urgent: false, text: `残り${Math.floor(hours / 24)}日${hours % 24}時間` };
            };

            // 期限が近い順に並べる
            const sortedBreads = [...breads]
                .filter(b => filter === 'all' || (filter === 'frozen' ? b.frozen : !b.frozen))
                .sort((a, b) => getExpirationTime(a) - getExpirationTime(b));
            const frozenCount = breads.filter(b => b.frozen).reduce((s, b) => s + b.stock, 0);
            const thawedCount = breads.filter(b => !b.frozen).reduce((s, b) => s + b.stock, 0);

            // ----- 店頭表示に出すパン（同じパンはまとめる） -----
            const displayItems = (() => {
                const map = new Map();
                breads.forEach(b => {
                    if (b.stock <= 0 || getTimeUntilExpiration(b).expired) return;
                    if (settings.source === 'thawed' && b.frozen) return;
                    const v = viewOf(b);
                    if (!v.name) return;
                    const key = b.masterId != null ? `m${b.masterId}` : `n${v.name}`;
                    const cur = map.get(key);
                    if (cur) {
                        cur.stock += b.stock;
                        if (!cur.photo && v.photo) cur.photo = v.photo;
                    } else {
                        map.set(key, { key, name: v.name, photo: v.photo, allergens: v.allergens, stock: b.stock });
                    }
                });
                return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
            })();
            const expiredCount = breads.filter(b => getTimeUntilExpiration(b).expired).length;
            const sortedMasters = [...masters].sort((a, b) => a.name.localeCompare(b.name, 'ja'));

            const tabBtn = (key, label) => (
                <button onClick={() => setTab(key)}
                    className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${
                        tab === key ? 'bg-white shadow-sm text-gray-900' : 'text-gray-600'
                    }`}>{label}</button>
            );

            if (displayMode) {
                return <DisplayView items={displayItems} settings={settings} onExit={() => setDisplayMode(false)} />;
            }

            return (
                <div className="min-h-screen bg-gray-50 p-4">
                    <div className="max-w-4xl mx-auto">
                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                                {error}
                                <button onClick={() => setError('')} className="float-right font-bold">×</button>
                            </div>
                        )}
                        {isLoading && (
                            <div className="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded mb-4">
                                📷 写真を圧縮・処理中...
                            </div>
                        )}

                        {/* ヘッダー */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <h1 className="text-2xl font-bold text-gray-800">パン在庫管理</h1>
                                <div className="flex items-center gap-3">
                                    <div className="hidden sm:flex items-center gap-1 text-sm text-gray-600">
                                        <Clock size={16} /> {formatDateTime(currentTime)}
                                    </div>
                                    <button onClick={() => setDisplayMode(true)}
                                        className="flex items-center gap-2 bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-medium">
                                        <Monitor size={16} /> 店頭表示
                                    </button>
                                </div>
                            </div>
                            <div className="flex bg-gray-100 rounded-lg p-1 mb-4">
                                {tabBtn('inventory', `在庫（${breads.length}）`)}
                                {tabBtn('master', `マスタ（${masters.length}）`)}
                                {tabBtn('display', '店頭表示の設定')}
                            </div>

                            {tab === 'display' ? (
                                <p className="text-sm text-gray-600">お客さんに見せる画面の文言と、表示するパンの範囲を決めます。</p>
                            ) : tab === 'inventory' ? (
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <button onClick={() => setShowReceive(true)}
                                        className="flex items-center justify-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                                        <Package size={20} /> 入荷を登録（マスタから選択）
                                    </button>
                                    <button onClick={() => fileInputRef.current?.click()} disabled={isLoading}
                                        className="flex items-center justify-center gap-2 border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-3 rounded-lg transition-colors">
                                        <Camera size={18} /> {isLoading ? '圧縮中...' : '臨時入荷（写真撮影）'}
                                    </button>
                                </div>
                            ) : (
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <button onClick={() => setEditingMaster('new')}
                                        className="flex items-center justify-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                                        <Plus size={20} /> パンをマスタに登録
                                    </button>
                                    <div className="flex gap-2">
                                        <button onClick={exportData} className="flex-1 px-4 py-3 rounded-lg border border-gray-300 text-gray-700 text-sm hover:bg-gray-50">バックアップ保存</button>
                                        <button onClick={() => importRef.current?.click()} className="flex-1 px-4 py-3 rounded-lg border border-gray-300 text-gray-700 text-sm hover:bg-gray-50">バックアップ読込</button>
                                    </div>
                                </div>
                            )}
                            <input type="file" ref={fileInputRef} onChange={handlePhotoCapture} accept="image/*" capture="environment" style={{ display: 'none' }} />
                            <input type="file" ref={importRef} onChange={importData} accept="application/json,.json" style={{ display: 'none' }} />
                        </div>

                        {/* ===== 在庫タブ ===== */}
                        {tab === 'inventory' && (
                            <>
                                {breads.length > 0 && (
                                    <div className="flex gap-2 mb-4 overflow-x-auto">
                                        {[
                                            ['all', `すべて`],
                                            ['thawed', `解凍済み・常温（${thawedCount}個）`],
                                            ['frozen', `冷凍庫（${frozenCount}個）`]
                                        ].map(([k, label]) => (
                                            <button key={k} onClick={() => setFilter(k)}
                                                className={`whitespace-nowrap px-4 py-2 rounded-full text-sm border ${filter === k ? 'bg-gray-800 border-gray-800 text-white' : 'bg-white border-gray-300 text-gray-700'}`}>
                                                {label}
                                            </button>
                                        ))}
                                    </div>
                                )}
                                {expiredCount > 0 && (
                                    <div className="flex items-center justify-between bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4">
                                        <span className="flex items-center gap-2"><AlertCircle size={18} /> 廃棄対象が {expiredCount} 件あります</span>
                                        <button onClick={deleteExpired} className="text-sm font-medium bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded">まとめて削除</button>
                                    </div>
                                )}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {sortedBreads.map((bread) => {
                                        const timeInfo = getTimeUntilExpiration(bread);
                                        const v = viewOf(bread);
                                        return (
                                            <div key={bread.id} className="bg-white rounded-lg shadow-sm overflow-hidden relative">
                                                <div className="aspect-video bg-gray-100 relative">
                                                    {v.photo ? (
                                                        <img src={v.photo} alt={v.name || 'パン'} className="w-full h-full object-cover" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-gray-500">画像なし</div>
                                                    )}
                                                    <div className="absolute top-2 left-2 flex gap-1">
                                                        {v.isTemp && (
                                                            <span className="text-xs bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded-full font-medium">臨時入荷</span>
                                                        )}
                                                        {bread.frozen && (
                                                            <span className="text-xs bg-sky-500 text-white px-2 py-0.5 rounded-full font-medium flex items-center gap-1"><Snowflake size={12} /> 冷凍</span>
                                                        )}
                                                        {bread.thawedAt && (
                                                            <span className="text-xs bg-orange-400 text-white px-2 py-0.5 rounded-full font-medium">解凍済み</span>
                                                        )}
                                                    </div>
                                                    {timeInfo.expired && (
                                                        <div className="absolute inset-0 bg-red-500 bg-opacity-75 flex items-center justify-center">
                                                            <div className="bg-white px-4 py-2 rounded-lg text-red-600 font-bold flex items-center gap-2">
                                                                廃棄対象
                                                                <button onClick={() => deleteBread(bread.id)} title="削除"
                                                                    className="ml-2 w-8 h-8 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center">
                                                                    <Trash2 size={14} />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="p-4">
                                                    {v.isTemp ? (
                                                        <input type="text" value={bread.name} onChange={(e) => updateBread(bread.id, { name: e.target.value })}
                                                            placeholder="パン名を入力"
                                                            className="w-full text-lg font-medium border-b border-gray-200 focus:border-blue-500 outline-none pb-1 mb-3" />
                                                    ) : (
                                                        <div className="text-lg font-medium text-gray-800 pb-1 mb-3 border-b border-gray-100">
                                                            {v.name}
                                                            {v.masterMissing && <span className="ml-2 text-xs text-gray-400">（マスタ削除済み）</span>}
                                                        </div>
                                                    )}

                                                    <div className="mb-3"><AllergenChips allergens={v.allergens} /></div>

                                                    <div className="text-sm text-gray-600 mb-2">
                                                        納品: {formatDateTime(bread.deliveryTime)}
                                                        {bread.thawedAt && <span className="ml-3 text-orange-700">解凍: {formatDateTime(bread.thawedAt)}</span>}
                                                    </div>

                                                    <div className="flex items-center gap-2 text-sm text-gray-600 mb-2">
                                                        {bread.thawedAt ? (
                                                            <>
                                                                <span>解凍後の日持ち:</span>
                                                                <select value={bread.thawHours ?? 0}
                                                                    onChange={(e) => updateBread(bread.id, { thawHours: Number(e.target.value) })}
                                                                    className="border border-gray-200 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none bg-white">
                                                                    {THAW_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                                                </select>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <span>{bread.frozen ? '冷凍保管:' : '日持ち:'}</span>
                                                                <select value={bread.expirationHours ?? 120}
                                                                    onChange={(e) => updateBread(bread.id, { expirationHours: Number(e.target.value) })}
                                                                    className="border border-gray-200 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none bg-white">
                                                                    {DAY_OPTIONS.map(d => <option key={d} value={d * 24}>{d}日</option>)}
                                                                </select>
                                                            </>
                                                        )}
                                                    </div>

                                                    {bread.frozen && bread.stock > 0 && !timeInfo.expired && (
                                                        <button onClick={() => thawOne(bread.id)}
                                                            className="w-full mb-3 py-2.5 rounded-lg bg-orange-50 hover:bg-orange-100 border border-orange-300 text-orange-800 font-medium text-sm">
                                                            1個解凍する（解凍後 {thawLabel(viewOf(bread).thawHours ?? bread.thawHours ?? 0)}）
                                                        </button>
                                                    )}

                                                    <div className={`text-sm font-medium mb-3 flex items-center gap-1 ${
                                                        timeInfo.expired ? 'text-red-600' : timeInfo.urgent ? 'text-orange-600' : 'text-gray-600'
                                                    }`}>
                                                        {(timeInfo.expired || timeInfo.urgent) && <AlertCircle size={16} />}
                                                        廃棄期限: {timeInfo.text}
                                                    </div>

                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <button onClick={() => updateStock(bread.id, -1)} disabled={bread.stock === 0}
                                                                className="w-10 h-10 bg-red-100 hover:bg-red-200 disabled:bg-gray-100 disabled:cursor-not-allowed text-red-600 disabled:text-gray-400 rounded-full flex items-center justify-center transition-colors">
                                                                <Minus size={16} />
                                                            </button>
                                                            <span className="text-xl font-bold w-8 text-center">{bread.stock}</span>
                                                            <button onClick={() => updateStock(bread.id, 1)}
                                                                className="w-10 h-10 bg-green-100 hover:bg-green-200 text-green-600 rounded-full flex items-center justify-center transition-colors">
                                                                <Plus size={16} />
                                                            </button>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            {v.isTemp && (
                                                                <button onClick={() => setEditingMaster({ fromBread: bread })}
                                                                    className="text-xs px-3 py-2 rounded-full border border-blue-300 text-blue-700 hover:bg-blue-50">
                                                                    マスタに登録
                                                                </button>
                                                            )}
                                                            <button onClick={() => deleteBread(bread.id)}
                                                                className="w-10 h-10 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 rounded-full flex items-center justify-center transition-colors">
                                                                <Trash2 size={16} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {breads.length > 0 && sortedBreads.length === 0 && (
                                    <p className="text-center py-10 text-gray-500">{filter === 'frozen' ? '冷凍庫の在庫はありません' : '解凍済みのパンはありません'}</p>
                                )}
                                {breads.length === 0 && !isLoading && (
                                    <div className="text-center py-12">
                                        <div className="flex justify-center text-gray-400 mb-4"><Package size={48} /></div>
                                        <p className="text-gray-600 text-lg">在庫はありません</p>
                                        <p className="text-gray-500 text-sm mt-2">
                                            {masters.length === 0
                                                ? 'まず「マスタ」タブで取り扱うパンを登録してください'
                                                : '「入荷を登録」から入荷したパンを選んでください'}
                                        </p>
                                    </div>
                                )}
                            </>
                        )}

                        {/* ===== マスタタブ ===== */}
                        {tab === 'master' && (
                            <>
                                <div className="bg-white rounded-lg shadow-sm divide-y">
                                    {sortedMasters.map(m => {
                                        const inUse = breads.filter(b => b.masterId === m.id).reduce((s, b) => s + b.stock, 0);
                                        return (
                                            <div key={m.id} className="flex items-center gap-3 p-3">
                                                <div className="w-16 h-16 rounded-lg bg-gray-100 overflow-hidden flex-shrink-0 flex items-center justify-center text-xs text-gray-400">
                                                    {m.photo ? <img src={m.photo} className="w-full h-full object-cover" /> : '写真なし'}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-medium text-gray-800 truncate">{m.name}</div>
                                                    <div className="text-xs text-gray-500 mb-1">日持ち {m.expirationDays}日 ・ 解凍後 {thawLabel(m.thawHours ?? 0)}{inUse > 0 && ` ・ 在庫 ${inUse}個`}</div>
                                                    <AllergenChips allergens={m.allergens} />
                                                </div>
                                                <button onClick={() => setEditingMaster(m)} title="編集"
                                                    className="w-10 h-10 bg-gray-100 hover:bg-blue-100 text-gray-600 hover:text-blue-600 rounded-full flex items-center justify-center">
                                                    <Pencil size={16} />
                                                </button>
                                                <button onClick={() => deleteMaster(m)} title="削除"
                                                    className="w-10 h-10 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 rounded-full flex items-center justify-center">
                                                    <Trash2 size={16} />
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                                {masters.length === 0 && (
                                    <div className="text-center py-12 text-gray-600">
                                        <p className="text-lg">マスタは空です</p>
                                        <p className="text-sm text-gray-500 mt-2">新しい仕入れ先のパンを登録しましょう</p>
                                    </div>
                                )}
                                <p className="text-xs text-gray-500 mt-4">
                                    ※ マスタと在庫はこの端末内に保存されます。機種変更やブラウザのデータ削除に備えて、ときどき「バックアップ保存」をしてください。
                                </p>
                            </>
                        )}
                    </div>

                    {tab === 'display' && (
                        <div className="max-w-4xl mx-auto">
                            <DisplaySettings
                                settings={settings}
                                onChange={(patch) => setSettings(s => ({ ...s, ...patch }))}
                                onReset={() => confirm('文言を初期設定に戻しますか？') && setSettings(DEFAULT_SETTINGS)}
                                itemCount={displayItems.length}
                                onStart={() => setDisplayMode(true)}
                            />
                        </div>
                    )}

                    {showReceive && (
                        <ReceiveModal
                            masters={sortedMasters}
                            onReceive={receive}
                            onClose={() => setShowReceive(false)}
                            onGoMaster={() => { setShowReceive(false); setTab('master'); setEditingMaster('new'); }}
                        />
                    )}

                    {editingMaster && (
                        <MasterForm
                            key={editingMaster === 'new' ? 'new' : (editingMaster.fromBread ? `b${editingMaster.fromBread.id}` : editingMaster.id)}
                            initial={
                                editingMaster === 'new' ? null
                                : editingMaster.fromBread ? {
                                    name: editingMaster.fromBread.name,
                                    expirationDays: Math.max(1, Math.round((editingMaster.fromBread.expirationHours ?? 120) / 24)),
                                    photo: editingMaster.fromBread.photo,
                                    allergens: editingMaster.fromBread.allergens || []
                                }
                                : editingMaster
                            }
                            onSave={(m) => saveMaster(m, editingMaster.fromBread?.id)}
                            onCancel={() => setEditingMaster(null)}
                            setError={setError}
                        />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<BreadInventoryApp />);
    </script>
</body>
</html>
